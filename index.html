/* ====================== SLUT PÅ MALLEN ====================== */

const cover = document.getElementById('cover');
const poemSec = document.getElementById('poem');
const wrap = document.getElementById('wrap');
let current = -1;

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function toTop() {
  const go = () => {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  };
  go();
  requestAnimationFrame(() => { go(); setTimeout(go, 60); });
}

function show(i) {
  current = i;
  const bg = i < 0 ? '#ffffff' : '#000000';
  document.documentElement.style.background = bg;
  document.body.style.background = bg;
  if (i < 0) {
    poemSec.style.display = 'none';
    cover.style.display = 'flex';
    toTop();
    return;
  }
  const p = POEMS[i];
  const last = i === POEMS.length - 1;
  const stanzas = p.text.trim().split(/\n\s*\n/).map(s => '<p>' + esc(s) + '</p>').join('');
  wrap.innerHTML =
    '<div class="num block">' + (i + 1) + ' / ' + POEMS.length + '</div>' +
    (p.title ? '<h2 class="ptitle block">' + esc(p.title) + '</h2>' : '') +
    '<div class="text">' + stanzas + '</div>' +
    '<button class="next block" id="nextBtn">' + (last ? 'Slut' : 'Nästa') + '</button>';
  cover.style.display = 'none';
  poemSec.style.display = 'block';
  toTop();
  document.getElementById('nextBtn').onclick = () => show(last ? -1 : i + 1);
}

cover.addEventListener('click', () => show(0));
</script>
